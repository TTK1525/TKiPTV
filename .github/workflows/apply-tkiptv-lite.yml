name: Apply TKiPTV Lite Browse patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch BrowseActivity
        run: python3 tools/patch_browse.py
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/tvchannels/src/main/kotlin/dev/tvremote/channels/BrowseActivity.kt
          git diff --cached --check
          git diff --cached --quiet || (git commit -m 'TKiPTV Lite: remove legacy browse features' && git push)
