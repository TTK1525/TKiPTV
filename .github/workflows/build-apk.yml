
name: Build TKiPTV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

  
      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          echo "Đang tìm dự án Gradle..."
          find . -maxdepth 5 \
            \( -name gradlew -o -name settings.gradle.kts -o -name settings.gradle \) \
            -print

          DIR=$(find . -maxdepth 5 -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$DIR" ]; then
            echo "Không tìm thấy settings.gradle"
            exit 1
          fi

          DIR=$(dirname "$DIR")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Đã tìm thấy dự án: $DIR"


      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :tvchannels:assembleDebug \
              --stacktrace
          else
            gradle :tvchannels:assembleDebug \
              --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p output
          find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -exec cp {} output/ \;
          test -n "$(find output -name '*.apk' -print -quit)"

      - name: Upload TKiPTV APK
        uses: actions/upload-artifact@v4
        with:
          name: TKiPTV-Debug-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
